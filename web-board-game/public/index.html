<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2c3e50">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">

    <link href="css/modal.css" rel="stylesheet">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- <link rel="stylesheet" href="style.css"> -->
    <title>Web Board Game - Alpha</title>
    <style>
        html {
            height: 100dvh;
            margin: 0;
            padding: 0;
        }
        .bungee-regular {
            font-family: "Bungee", sans-serif;
            font-weight: 400;
            font-style: normal;
        }
        :root {
            --bg-color: #2c3e50; /* CLOUD WISP #F1FAFF / CANDY FLOSS #FEECEB / CREAME #FFF5EA / MOJITO BREEZE #FBFFF4 / COLD STEEL #F8F7F4             */
            --board-bg: #DAC6CC;
            --accent-color: #FDFBF6;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            
            /* 1. 높이 설정: vh 대신 dvh를 사용해 주소창 문제를 해결합니다. */
            height: 100vh; /* 구형 브라우저 대비 */
            height: 100dvh; /* 최신 브라우저: 화면에 딱 맞게 조절 */
            
            /* 2. 넘침 방지 */
            overflow: hidden;
            font-family: 'Pretendard', sans-serif;

            /* background-image: url('img/background-img.png'); */
            background-position: center;
            background-repeat: no-repeat;
            
            /* 3. 배경 고정 해제: fixed는 때때로 모바일에서 계산 오류를 일으킵니다. 
            화면 전체가 배경이라면 fixed를 지우는 것이 더 정확하게 맞습니다. */
            /* background-attachment: fixed; */

            /* 4. 비율 무시하고 꽉 채우기 */
            background-size: 100% 100%;
        }

        #game-container { position: relative; display: flex; align-items: center; justify-content: center; }

        canvas { 
            background: var(--board-bg); 
            /* border: 3px solid #34495e;  */
            border-radius: 0px;
            /* box-shadow: 0 10px 30px rgba(0,0,0,0.5); */

            
            /* background-image: url('img/background-img.png');
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed; */
            
            
            /* background-size: cover; */

        }



        #leaderboard {
            position: absolute; top: 10%; left: 10%; font-weight: bold;

            width: 10%;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 5px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            pointer-events: auto; /* 리더보드는 스크롤 가능하게 */
            overflow-y: auto;
        }

        #player-table { 
            width: 100%; border-collapse: collapse; 
            font-size: clamp(12px, 2.5vh, 16px); /* 화면 높이에 따라 폰트 조절 */
        }
        
        #player-table th { border-bottom: 2px solid #ddd; padding: 12px 5px; color: #333; }
        #player-table td { padding: 12px 5px; text-align: center; }
        /* 보드 중앙 내부 UI */
        #inner-ui {
            position: absolute;
            top: 72vh; left: 50%;
            transform: translate(-50%, -50%);
            width: 70%; /* 11x11 보드 중앙 빈 공간에 맞춤 */
            max-height: 55%;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none; /* 클릭 방해 금지 */
        }
        /* 상태 메시지 및 결과 텍스트 */
        #status {
            /* transform: translate(-50%, -50%); */
            position: absolute; top: 5%; left:4%; font-weight: bold;
            /* background: rgba(0,0,0,0.5);  */
            color: #000;
            padding: 5px 15px; border-radius: 5px; font-size: 13px;
        }
        #your-turn {
            transform: translate(-50%, -50%);
            position: absolute; top: 65vh; left:50%;
            color: white;
            padding: 5px 15px; border-radius: 5px; font-size: 5vw;

            font-family: "Bungee", sans-serif;
            font-style: "normal";
        }

        #result-textText {
            margin-top: 10px;
            /* background: rgba(0,0,0,0.5);  */
            color: #fff; padding: 5px 10px; border-radius: 5px;
            font-weight: bold; font-size: 1.5vw;
        }

        /* 플로팅 주사위 버튼 */
        /* #roll-btn {
            position: absolute; bottom: 25%; right: 15%;
            width: 100px; height: 100px; border-radius: 50%;
            font-size: 24px; background: var(--accent-color); border: 3px solid #fff;
            color: white; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex; justify-content: center; align-items: center;
            z-index: 100;
        }
        #roll-btn:disabled { background: #7f8c8d; opacity: 0.7; } */

        /* 모바일 가로모드 최적화: 주사위 버튼 위치 조정 */
        @media (max-height: 500px) {
            #roll-btn { width: 70px; height: 70px; font-size: 20px; }
            #inner-ui { width: 65%; }
        }

        .bankbook {
            position: fixed;
            bottom: 20px;
            left: 30px;
            min-width: 17vw;
            font-family: 'Courier New', Courier, monospace;
            z-index: 100;
            /* 우측으로 약간 기울어지게 회전 및 원근감 적용 */
            transform: perspective(1000px) rotateY(15deg) rotateX(5deg);    
            box-shadow: -10px 10px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }

        .bankbook:hover {
            transform: perspective(1000px) rotateY(-5deg) rotateX(0deg);
        }

        .bankbook-top {
            background-color: #3498db; /* 통장 커버 색상 */
            color: white;
            padding: 8px 15px;
            border-radius: 10px 10px 0 0;
            font-weight: bold;
            border-bottom: 2px solid rgba(0,0,0,0.1);
        }

        .bankbook-bottom {
            background-color: #fdfae5; /* 통장 속지 색상 (연한 미색) */
            padding: 15px;
            border-radius: 0 0 10px 10px;
            min-height: 8vh;
            border: 1px solid #dcdde1;
        }

        .info-row {
            margin-bottom: 8px;
            border-bottom: 1px dotted #ccc;
            display: flex;
            justify-content: space-between;
        }

        .label {
            color: #7f8c8d;
            font-size: 0.8rem;
        }

        #my-money {
            color: #2c3e50;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .unit { font-size: 0.8rem; margin-left: 2px; }

.dice-button-wrapper {
    position: fixed;
    bottom: 40px;
    right: 50px;
    perspective: 1000px; /* 3D 효과를 위한 원근감 */
}

.isometric-btn {
    position: relative;
    width: 80px;
    height: 80px;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 0;
    /* Isometric 각도: 오른쪽으로 약간 기울임 */
    transform: rotateX(55deg) rotateZ(-45deg);
    transform-style: preserve-3d;
    transition: transform 0.1s ease, filter 0.2s;
}

/* 버튼의 윗면 (키캡 상단) */
.btn-top {
    display: flex;
    align-items: center;
    justify-content: center;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #F2F2F2; /* 통장 속지와 비슷한 따뜻한 흰색  #fdfae5*/
    border: 2px solid #AAB6BE; /* #b2a3b0 */
    color: #2c3e50;
    font-weight: bold;
    font-size: 1.2rem;
    border-radius: 8px;
    transform: translateZ(20px); /* 위로 띄워서 두께 형성 */
    transition: transform 0.1s ease;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
}

/* 버튼의 옆면 (두께 부분) */
.btn-side {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #AAB6BE; /* 맵 블록 옆면과 통일감 있는 색상 #dac6cc*/
    border: 2px solid #839AA1; /* #888294 */
    border-radius: 8px;
    transform: translateZ(0);
}

/* 버튼을 눌렀을 때의 효과 (키보드 클릭감) */
.isometric-btn:active .btn-top {
    transform: translateZ(5px); /* 눌렀을 때 높이가 낮아짐 */
}

.isometric-btn:disabled {
    filter: grayscale(1);
    cursor: not-allowed;
    opacity: 0.7;
}

/* 버튼 위에 글자나 아이콘 추가 디테일 */
.btn-top::after {
    /* content: "🎲"; */
    position: absolute;
    bottom: 5px;
    right: 5px;
    font-size: 0.8rem;
    opacity: 0.5;
}
    </style>
</head>
<body>
    <div id="start-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #DAC6CC; z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white;">
        <p style="font-family: Bungee, sans-serif; font-size: 13vh;">WORLD IN BOARD</p>
        <button id="start-btn" style="width: 200px; padding: 20px; background: #2ecc71; border: none; border-radius: 10px; font-size: 20px; color: white; cursor: pointer;">게임 시작</button>
        <p style="margin-top: 15px; font-size: 14px; color: #aaa;">모바일은 가로 모드로 플레이하세요!</p>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="personal-ui" class="bankbook">
            <div id="bankbook-cover" class="bankbook-top">
                <span class="bankbook-title">MY ASSETS</span>
            </div>
            <div class="bankbook-bottom">
                <div class="info-row">
                    <span class="label">NAME:</span>
                    <span id="my-name-display">---</span> </div>
                <div class="info-row">
                    <span class="label">CASH:</span>
                    <span id="my-money-display">0</span><span class="unit">만</span> </div>
                <div class="info-row">
                    <span class="label">LANDS:</span>
                    <span id="my-lands-display">0</span> </div>
            </div>
        </div>
        <!-- <div id="leaderboard">
                <table id="player-table">
                    <thead>
                        <tr>
                            <th>이름</th>
                            <th>잔액</th>
                            <th>자산</th>
                        </tr>
                    </thead>
                    <tbody id="player-list"></tbody>
                </table>
        </div> -->
        <div id="status"></div>

        <div id="your-turn">대기 중</div>
        <div id="inner-ui">
            <p id="result-textText">주사위를 굴려주세요!</p>
        </div>

        <div class="dice-button-wrapper">
            <button id="roll-btn" class="isometric-btn">
                <span class="btn-top">ROLL</span>
                <span class="btn-side"></span>
            </button>
        </div>
        
        <!-- <button id="roll-btn" type="button" disabled>🎲</button> -->
    </div>
    <!-- background: rgba(0,0,0,0.85); -->
    <div id="custom-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <p id="modal-title">제목</p>
            <div class="modal-divider"></div>
            <p id="modal-message">메시지</p>
            <div class="modal-buttons">
                <button id="modal-cancel-btn">취소</button>
                <button id="modal-confirm-btn">확인</button>
            </div>
        </div>
    </div>
    <!-- background: rgba(0,0,0,0.85); -->
    <div id="bankruptcy-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center;">
        <h1 style="font-size: 50px; color: #e74c3c; margin-bottom: 10px;">BANKRUPT</h1>
        <p id="bankrupt-msg" style="font-size: 18px; margin-bottom: 30px;">자금이 부족하여 파산하였습니다.</p>
        <button onclick="location.reload()" style="padding: 15px 30px; background: #3498db; border: none; border-radius: 5px; color: white; cursor: pointer; font-size: 16px;">처음으로 돌아가기</button>
    </div>

    <div id="winner-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center;">
        <h1 style="font-size: 50px; color: #a5e73c; margin-bottom: 10px;">WIN</h1>
        <p id="winner-msg" style="font-size: 18px; margin-bottom: 30px;">게임에서 승리하였습니다.</p>
        <button onclick="location.reload()" style="padding: 15px 30px; background: #3498db; border: none; border-radius: 5px; color: white; cursor: pointer; font-size: 16px;">처음으로 돌아가기</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js"></script>
</body>
</html>
