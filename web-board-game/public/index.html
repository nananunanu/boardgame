<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
    <link href="css/modal.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- <link rel="stylesheet" href="style.css"> -->
    <title>Web Board Game - Alpha</title>
</head>
<body ontouchstart="">
    <div id="start-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #DAC6CC; z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white;">
        <div id="start-screen">
        <p style="font-family: Bungee, sans-serif; font-size: 8vh;">WORLD IN BOARD</p>
        
        <div id="login-form" style="display: flex; flex-direction: column; gap: 10px; width: 300px;">
            <input type="text" id="user-id" placeholder="아이디" style="padding: 12px; border-radius: 5px; border: none;">
            <input type="password" id="user-pw" placeholder="비밀번호" style="padding: 12px; border-radius: 5px; border: none;">
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button id="login-btn" style="flex: 1; padding: 12px; background: #2ecc71; border: none; border-radius: 5px; color: white; cursor: pointer;">로그인</button>
                <button id="open-register-btn" style="flex: 1; padding: 12px; background: #3498db; border: none; border-radius: 5px; color: white; cursor: pointer;">회원가입</button>
            </div>
        </div>

        <div id="register-form" style="display: none; flex-direction: column; gap: 8px; width: 300px; background: rgba(0,0,0,0.4); padding: 17px; border-radius: 15px;">
            <h3 style="margin-top: 0;">새 계정 만들기</h3>
            <input type="text" id="reg-nickname" placeholder="닉네임" style="padding: 10px; border-radius: 5px; border: none;">
            <input type="text" id="reg-id" placeholder="아이디" style="padding: 10px; border-radius: 5px; border: none;">
            <input type="password" id="reg-pw" placeholder="비밀번호" style="padding: 10px; border-radius: 5px; border: none;">
            <input type="password" id="reg-pw-confirm" placeholder="비밀번호 확인" style="padding: 10px; border-radius: 5px; border: none;">
            
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button id="do-register-btn" style="flex: 1; padding: 8px; background: #e67e22; border: none; border-radius: 5px; color: white; cursor: pointer;">가입하기</button>
                <button id="cancel-register-btn" style="flex: 1; padding: 8px; background: #95a5a6; border: none; border-radius: 5px; color: white; cursor: pointer;">취소</button>
            </div>
        </div>
        <p style="margin-top: 20px; font-size: 14px; color: #666;">모바일은 가로 모드로 플레이하세요!</p>
    </div>
    </div>
    <div id="lobby-overlay" style="display: none; flex-direction: column;">
        <div>
            <div class="room-list-top-bunch">
                <div class="left-group" style="display: flex;">
                    <div id="room-list-top-btn1" class="room-list-top">목록</div>
                    <div class="room-list-top2"></div>
                    <div class="room-list-top3"></div>
                </div>
                <div class="right-group" style="display: flex;">
                    <div class="room-list-top-button" id="create-room-btn">방 개설하기</div>
                    <div class="room-list-top-button" id="refresh-btn">새로고침</div>
                </div>
            </div>
            <div id="room-list-container" class="room-list-background">
                <div id="player-money"></div>
                <ul class="room-list" id="room-ul">
                </ul>
            </div>
            <div id="room-create-container" style="display: none; flex-direction: column;" class="room-create-background">
                <div style="display: flex; justify-content: space-evenly; margin-top: 10px;">
                    <div>
                        <input id="room-create-title" placeholder="방 제목을 입력해주세요"></input>
                    </div>
                    <div style="display: flex;">
                        <div class="room-create-player-count" data-value="1">인원1</div>
                        <div class="room-create-player-count" data-value="2">인원2</div>
                        <div class="room-create-player-count" data-value="3">인원3</div>
                        <div class="room-create-player-count" data-value="4">인원4</div>
                        <div class="room-create-player-count" data-value="5">인원5</div>
                    </div> 
                </div>
                <div style="display: flex; justify-content: space-evenly; margin-top: 10px;">
                    <div class="room-create-public-private" data-value="false">
                        Public
                    </div>
                    <div class="room-create-public-private" data-value="true">
                        private
                    </div>
                </div>
                <div style="display: flex;">
                    <button id="confirm-create-btn">방 만들기</button>
                </div>
            </div>
        </div>
    </div>
    
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="personal-ui" class="bankbook">
            <div id="bankbook-cover" class="bankbook-top">
                <span class="bankbook-title">MY ASSETS</span>
            </div>
            <div class="bankbook-bottom">
                <div class="info-row">
                    <span class="label">NAME:</span>
                    <span id="my-name-display">---</span> </div>
                <div class="info-row">
                    <span class="label">CASH:</span>
                    <span id="my-money-display">0</span><span class="unit">만</span> </div>
                <div class="info-row">
                    <span class="label">LANDS:</span>
                    <span id="my-lands-display">0</span> </div>
            </div>
        </div>
        <div id="status"></div>

        <div id="your-turn">대기 중</div>
        <div id="inner-ui">
            <p id="result-textText">주사위를 굴려주세요!</p>
        </div>

        <div class="dice-button-wrapper">
            <button id="roll-btn" class="isometric-btn">
                <span class="btn-top">ROLL</span>
                <span class="btn-side"></span>
            </button>
        </div>
        
    </div>
    <!-- background: rgba(0,0,0,0.85); -->
    <div id="custom-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <p id="modal-title">제목</p>
            <div class="modal-divider"></div>
            <p id="modal-message">메시지</p>
            <div class="modal-buttons">
                <button id="modal-cancel-btn">취소</button>
                <button id="modal-confirm-btn">확인</button>
            </div>
        </div>
    </div>
    <div id="chance-card" class="chance-card-wrapper" style="display: none;">
        <div class="chance-card-inner">
            <p id="card-title" class="chance-title">제목</p>
            <div class="modal-divider"></div>
            <p id="card-description" class="chance-description">제목</p>
        </div>
    </div>

    
    <button  style="display: none;" onclick="location.reload()" id="game-leave-btn">게임 나가기</button>
    
    <div id="bankruptcy-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center;">
        <h1 style="font-size: 50px; color: #e74c3c; margin-bottom: 10px;">BANKRUPT</h1>
        <p id="bankrupt-msg" style="font-size: 18px; margin-bottom: 30px;">자금이 부족하여 파산하였습니다.</p>
        
        <div style="display: flex; gap: 10px;">
            <button onclick="location.reload()" style="padding: 15px 30px; background: #3498db; border: none; border-radius: 5px; color: white; cursor: pointer; font-size: 16px;">게임 나가기</button>
            <button id="spectator-mode-btn" style="padding: 15px 30px; background: #3498db; border: none; border-radius: 5px; color: white; cursor: pointer; font-size: 16px;">관전 하기</button>
        </div>
    </div>

    <div id="winner-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center;">
        <h1 style="font-size: 50px; color: #a5e73c; margin-bottom: 10px;">WIN</h1>
        <p id="winner-msg" style="font-size: 18px; margin-bottom: 30px;">게임에서 승리하였습니다.</p>
        <button onclick="location.reload()" style="padding: 15px 30px; background: #3498db; border: none; border-radius: 5px; color: white; cursor: pointer; font-size: 16px;">게임 나가기</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="./js/game.js"></script>
</body>
</html>
